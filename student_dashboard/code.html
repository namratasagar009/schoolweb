<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>S.S. Memorial - Student Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Nunito+Sans:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#bec6e0",
                        "secondary": "#50616b",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-fixed": "#001e2c",
                        "background": "#f7f9fb",
                        "primary-fixed": "#dae2fd",
                        "secondary-fixed-dim": "#b7c9d5",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f4f6",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#c4e7ff",
                        "on-primary-fixed": "#131b2e",
                        "tertiary": "#000000",
                        "inverse-on-surface": "#eff1f3",
                        "surface-dim": "#d8dadc",
                        "secondary-fixed": "#d3e5f1",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-container": "#008ebf",
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "surface-tint": "#565e74",
                        "on-surface": "#191c1e",
                        "inverse-primary": "#bec6e0",
                        "on-secondary-fixed-variant": "#384953",
                        "secondary-container": "#d3e5f1",
                        "outline-variant": "#c6c6cd",
                        "tertiary-container": "#001e2c",
                        "surface-container": "#eceef0",
                        "primary": "#000000",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#7bd0ff",
                        "on-tertiary-fixed-variant": "#004c69",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "outline": "#76777d",
                        "on-secondary-fixed": "#0c1e26",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-container": "#566771",
                        "primary-container": "#131b2e",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "on-primary-container": "#7c839b",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#45464d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-desktop": "48px",
                        "base-unit": "8px",
                        "margin-mobile": "16px",
                        "container-max-width": "1280px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-lg": ["Nunito Sans"],
                        "headline-md": ["Nunito Sans"],
                        "label-md": ["Inter"],
                        "headline-xl": ["Nunito Sans"],
                        "headline-lg-mobile": ["Nunito Sans"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0 font-body-md">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background text-primary dark:text-primary-fixed-dim font-headline-md text-headline-md w-full sticky top-0 z-50 shadow-sm flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[24px]">school</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">S.S. Memorial</span>
</div>
<!-- Desktop Nav Cluster (Hidden on mobile) -->
<nav class="hidden md:flex gap-6">
<a class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 transition-transform px-3 py-2 rounded-md font-label-md text-label-md" href="#">Home</a>
<a class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 transition-transform px-3 py-2 rounded-md font-label-md text-label-md" href="#">Timetable</a>
<a class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 transition-transform px-3 py-2 rounded-md font-label-md text-label-md" href="#">Subjects</a>
<a class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 transition-transform px-3 py-2 rounded-md font-label-md text-label-md" href="#">Profile</a>
</nav>
<button class="active:scale-95 transition-transform p-2 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Canvas -->
<main class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-6 md:py-12 space-y-8">
<!-- Top Section: Welcome & Attendance -->
<section class="flex flex-col md:flex-row gap-6 justify-between items-start">
<div class="space-y-2">
<div class="inline-flex items-center px-3 py-1 bg-secondary-fixed text-on-secondary-fixed font-label-md text-label-md rounded-full">
                    Class 8-A
                </div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg">Good Morning, Aryan!</h1>
<p class="text-on-surface-variant font-body-md text-body-md">Ready for a day of guided discovery?</p>
</div>
<!-- Attendance Widget -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 flex items-center gap-6 shadow-sm w-full md:w-auto">
<div class="relative w-16 h-16">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<path class="text-surface-variant" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="100, 100" stroke-width="3"></path>
<path class="text-tertiary-fixed-dim" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="92, 100" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center font-label-md text-label-md">
                        92%
                    </div>
</div>
<div>
<h3 class="font-headline-md text-headline-md">Attendance</h3>
<p class="text-on-surface-variant font-body-sm text-body-sm">You're on track!</p>
</div>
</div>
</section>
<!-- Middle Section: Up Next -->
<section>
<h2 class="font-headline-md text-headline-md mb-4 text-on-surface">Up Next</h2>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-sm border-t-[4px] border-t-tertiary-fixed-dim flex flex-col md:flex-row gap-6 items-center">
<div class="bg-surface-container-low w-16 h-16 rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[32px] text-on-tertiary-container">calculate</span>
</div>
<div class="flex-grow text-center md:text-left">
<h3 class="font-headline-md text-headline-md">Mathematics</h3>
<p class="text-on-surface-variant font-body-md text-body-md">with Mrs. Sharma</p>
</div>
<div class="text-center md:text-right">
<div class="font-label-md text-label-md text-primary bg-primary-fixed-dim/20 px-3 py-1 rounded-full inline-block mb-1">
                        10:00 AM - 10:45 AM
                    </div>
<p class="text-on-surface-variant font-body-sm text-body-sm">Room 302</p>
</div>
</div>
</section>
<!-- Bottom Section: Quick Actions Grid -->
<section>
<h2 class="font-headline-md text-headline-md mb-4 text-on-surface">Quick Links</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<!-- Action 1 -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow flex items-center gap-4 text-left group">
<div class="bg-secondary-fixed text-on-secondary-fixed p-3 rounded-lg group-hover:bg-secondary-fixed-dim transition-colors">
<span class="material-symbols-outlined fill">assignment</span>
</div>
<div>
<h4 class="font-label-md text-label-md">Homework</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">2 assignments due</p>
</div>
</button>
<!-- Action 2 -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow flex items-center gap-4 text-left group">
<div class="bg-tertiary-fixed text-on-tertiary-fixed p-3 rounded-lg group-hover:bg-tertiary-fixed-dim transition-colors">
<span class="material-symbols-outlined fill">military_tech</span>
</div>
<div>
<h4 class="font-label-md text-label-md">Results</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">View term grades</p>
</div>
</button>
<!-- Action 3 -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow flex items-center gap-4 text-left group">
<div class="bg-primary-fixed text-on-primary-fixed p-3 rounded-lg group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined fill">campaign</span>
</div>
<div>
<h4 class="font-label-md text-label-md">Assembly</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Weekly schedule</p>
</div>
</button>
</div>
</section>
</main>
<!-- BottomNavBar (Visible only on Mobile) -->
<nav class="md:hidden bg-surface dark:bg-on-background text-primary dark:text-primary-fixed-dim font-label-md text-label-md fixed bottom-0 w-full z-50 bg-surface dark:bg-on-background shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t-[0px] fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 pb-2">
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-fixed-dim text-on-secondary-container dark:text-on-secondary-fixed-variant rounded-full px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-dim transition-colors active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined fill text-[24px] mb-1">home</span>
<span class="text-[10px] font-semibold tracking-wide">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-dim transition-colors active:scale-90 transition-transform duration-200 px-5 py-1">
<span class="material-symbols-outlined text-[24px] mb-1">calendar_month</span>
<span class="text-[10px] font-semibold tracking-wide">Timetable</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-dim transition-colors active:scale-90 transition-transform duration-200 px-5 py-1">
<span class="material-symbols-outlined text-[24px] mb-1">book</span>
<span class="text-[10px] font-semibold tracking-wide">Subjects</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-dim transition-colors active:scale-90 transition-transform duration-200 px-5 py-1">
<span class="material-symbols-outlined text-[24px] mb-1">person</span>
<span class="text-[10px] font-semibold tracking-wide">Profile</span>
</button>
</nav>
</body></html>
